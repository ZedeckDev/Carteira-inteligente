services:
  - type: web
    name: carteira-inteligente
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: carteira-inteligente-db
          property: connectionString

databases:
  - name: carteira-inteligente-db
    plan: free
    databaseName: carteira_investimentos
    user: carteira
