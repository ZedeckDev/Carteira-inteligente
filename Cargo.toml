[package]
name = "carteira-inteligente"
version = "0.1.0"
edition = "2021"
description = "Carteira Inteligente de Investimentos Fullstack em Rust"

[dependencies]
# Web Framework e Async Runtime
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "trace", "cors"] }
tower-cookies = { version = "0.10", features = ["signed"] }

# Template Engine (Compile-time HTML rendering)
askama = { version = "0.12", features = ["with-axum"] }
askama_axum = "0.4"

# Banco de Dados e Migrações
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "sqlite",
    "chrono",
    "uuid",
    "macros",
    "migrate"
] }

# Serialização e Tipos
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"

# Segurança e Criptografia
argon2 = { version = "0.5", features = ["std"] }
rand_core = { version = "0.6", features = ["std"] }

# Validação e Utilitários
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
validator = { version = "0.18", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
