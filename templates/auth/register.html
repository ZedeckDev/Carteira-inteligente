<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Carteira Inteligente de Investimentos</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/components.css">
</head>

<body class="auth-page-body">
    <div class="auth-wrapper">
        <div class="auth-card glass-card">
            <div class="auth-header">
                <div class="brand-logo large-logo">
                    <i class="fa-solid fa-chart-pie"></i>
                </div>
                <h1>Criar Conta</h1>
                <p class="auth-tagline">Comece a organizar e turbinar seus investimentos hoje</p>
            </div>

            {% if let Some(err) = error_message %}
            <div class="alert alert-danger">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>{{ err }}</span>
            </div>
            {% endif %}

            <form action="/auth/register" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="name"><i class="fa-solid fa-user"></i> Nome Completo</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Ex: Roberto Silva"
                        required autofocus>
                </div>

                <div class="form-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> E-mail</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="seu.email@exemplo.com"
                        required>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Senha</label>
                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="Mínimo 6 caracteres" required minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirm_password"><i class="fa-solid fa-lock-open"></i> Confirmar Senha</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control"
                        placeholder="Repita a senha" required minlength="6">
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    <span>Criar Minha Carteira</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Já possui conta? <a href="/login" class="auth-link">Fazer Login</a></p>
            </div>
        </div>
    </div>
</body>

</html>
