<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Carteira Inteligente de Investimentos</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/components.css">
</head>
<body class="auth-page-body">
    <div class="auth-wrapper">
        <div class="auth-card glass-card">
            <div class="auth-header">
                <div class="brand-logo large-logo">
                    <i class="fa-solid fa-chart-pie"></i>
                </div>
                <h1>CARTEIRA</h1>
                <p class="auth-tagline">Acesse sua plataforma inteligente de investimentos</p>
            </div>

            {% if let Some(err) = error_message %}
            <div class="alert alert-danger">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>{{ err }}</span>
            </div>
            {% endif %}

            <form action="/auth/login" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> E-mail</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="seu.email@exemplo.com" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Senha</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    <span>Entrar na Plataforma</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Ainda não tem conta? <a href="/register" class="auth-link">Cadastre-se gratuitamente</a></p>
            </div>
        </div>
    </div>
</body>
</html>
